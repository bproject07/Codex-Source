name: Bug report
description: Report a reproducible problem caused by this fork.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing. This tracker is for `bproject07/Codex-Source`, including Codex Raw.

        If the problem reproduces in unmodified current Codex, use the upstream
        tracker. For a security vulnerability, stop and use the private security
        reporting link on the issue chooser.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Codex Raw CLI
        - Codex Raw HTTP API
        - Inherited Codex behavior modified by this fork
        - Build or packaging
        - Other fork-specific behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      description: Paste the version and, for source builds, the commit identifier.
      placeholder: codex-raw 0.x.y / commit abc1234
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: Windows 11 x86_64, Ubuntu 24.04 x86_64, macOS 15 arm64
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Installation or build method
      placeholder: Local Cargo build, release artifact, or other method
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic reproduction you can.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors or logs after removing secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include upstream comparison, configuration, or workarounds if relevant.
  - type: checkboxes
    id: hygiene
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed tokens, credentials, private prompts, personal data, and unrelated logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
