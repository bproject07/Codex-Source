version: 2
updates:
  - package-ecosystem: cargo
    directory: /codex-rs
    schedule:
      interval: monthly
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: rust-toolchain
    directory: codex-rs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
